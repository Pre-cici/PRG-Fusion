# Demo inputs ship in assets/demo; run from the repository root.
setup:
  model: vis
  experiment: transfer2_singleview_vis_lidar_full_canvas
  checkpoint_path: hf://nvidia/Cosmos-Transfer2.5-2B/general/blur/ba2f44f2-c726-4fe7-949f-597069d9b91c_ema_bf16.pt
  control_branch_checkpoint_path: checkpoints/PRG-Fusion/model
  control_branch_indices: [0, 1]
  experiment_overrides:
  - model.config.state_t=24
  - model.config.hint_keys=vis_lidar
  - model.config.control_branch_checkpoint_paths=[hf://nvidia/Cosmos-Transfer2.5-2B/general/blur/ba2f44f2-c726-4fe7-949f-597069d9b91c_ema_bf16.pt,hf://nvidia/Cosmos-Transfer2.5-2B/general/edge/61f5694b-0ad5-4ecd-8ad7-c8545627d125_ema_bf16.pt]
  - model.config.control_branch_overlay_checkpoint_path=null
  - model.config.use_reference_image=false
  - model.config.use_control_masks_during_training=true
  - model.config.apply_control_masks_to_residuals=false
  - model.config.normalize_control_weight_maps=false
  - model.config.use_prg_teacher_degradation_query=false
  - model.config.use_prg_dense_gate=true
  - model.config.use_prg_adaptive_dense_gate=false
  - model.config.net.use_spatial_degradation_query=false
  - model.config.net.use_vis_prg_teacher_query=false
  - model.config.net.use_prg_dense_gate=true
  - model.config.net.use_prg_adaptive_dense_gate=false
  - +model.config.net.prg_dense_gate_branch_class_weights=[[1.0,0.5,0.25],[0.25,1.0,0.0]]
  - +model.config.tokenizer.vae_pth=checkpoints/nvidia/Cosmos-Predict2.5-2B/f176dc95b4a70f53ce01c4b302851595e7322b00/tokenizer.pth
  - +model.config.text_encoder_config.model_config.tokenizer.cache_dir=checkpoints/Qwen/Qwen2.5-VL-7B-Instruct/cc594898137f460bfe9f0759e9844b3ce807cfb5
  - model.config.text_encoder_config.ckpt_path=checkpoints/nvidia/Cosmos-Reason1-7B/3210bec0495fdc7a8d3dbb8d58da5711eab4b423

inference:
- name: demo
  video_path: ../../assets/demo/vis.mp4
  prompt: A realistic forward-facing driving video.
  seed: 2025
  guidance: 3
  num_steps: 12
  max_frames: 93
  resolution: "720"
  num_conditional_frames: 1
  num_video_frames_per_chunk: 93
  use_prg_dense_gate: true
  prg_aux_dir: ../../assets/demo/prg
  vis:
    control_path: ../../assets/demo/vis.mp4
    control_weight: 1.0
  lidar:
    control_path: ../../assets/demo/lidar.mp4
    control_weight: 1.0
    mask_top_rows: 256
